---
- name: Install base prerequisites
  ansible.builtin.apt:
    name:
      - software-properties-common
      - ca-certificates
      - curl
      - gnupg
      - python3
      - python3-apt
      - dkms
      - linux-headers-generic
      - iptables
      - iptables-persistent
      - fail2ban
    state: present
    update_cache: true

- name: Add Amnezia PPA
  ansible.builtin.apt_repository:
    repo: ppa:amnezia/ppa
    state: present
    update_cache: true

- name: Install AmneziaWG
  ansible.builtin.apt:
    name:
      - amneziawg
      - amneziawg-tools
      - amneziawg-dkms
    state: present

- name: Enable IPv4 forwarding persistently
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    sysctl_set: true
    reload: true

- name: Enable Fail2Ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true

- name: Check swapfile
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat

- name: Create swapfile
  ansible.builtin.command:
    cmd: fallocate -l {{ swap_size_mb }}M /swapfile
  when:
    - not swapfile_stat.stat.exists
    - not ansible_check_mode
  register: swapfile_created

- name: Set swapfile permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'
  when:
    - not ansible_check_mode
    - swapfile_stat.stat.exists or (swapfile_created is defined and swapfile_created.changed)

- name: Initialize new swapfile
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when:
    - not ansible_check_mode
    - swapfile_created is defined
    - swapfile_created.changed

- name: Check whether swapfile is active
  ansible.builtin.shell:
    cmd: swapon --show=NAME --noheadings | grep -Fxq /swapfile
  register: swapfile_active
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Enable swapfile
  ansible.builtin.command:
    cmd: swapon /swapfile
  when:
    - not ansible_check_mode
    - swapfile_active.rc != 0

- name: Persist swapfile in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present

