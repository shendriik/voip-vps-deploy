---
- name: Install coturn
  ansible.builtin.apt:
    name: coturn
    state: present

- name: Ensure coturn log file exists
  ansible.builtin.file:
    path: /var/log/turnserver.log
    state: touch
    owner: turnserver
    group: turnserver
    mode: '0640'
    access_time: preserve
    modification_time: preserve

- name: Deploy coturn configuration
  ansible.builtin.template:
    src: turnserver.conf.j2
    dest: /etc/turnserver.conf
    owner: root
    group: turnserver
    mode: '0640'
  no_log: true
  diff: false
  notify: Restart coturn

- name: Enable and start coturn
  ansible.builtin.systemd:
    name: coturn
    enabled: true
    state: started
  when:
    - coturn_enabled
    - not ansible_check_mode
